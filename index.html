<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="start-page">
    <div id="hearts-container" class="animation-container"></div>
    
    <div class="page-wrapper">
      <h1 class="birthday-title">Happy Birthday!</h1>
      <p style="font-size: 1.2rem; font-weight: 300; opacity: 0.8; margin-bottom: 1rem;">To my beautiful best friend ❤️</p>
      
      <div class="countdown-container">
        <h2 class="countdown-title">Counting down to 20-09-2026</h2>
        <div class="countdown">
          <div class="time-box">
            <span class="time-value" id="days">00</span>
            <span class="time-label">Days</span>
          </div>
          <div class="time-box">
            <span class="time-value" id="hours">00</span>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-box">
            <span class="time-value" id="minutes">00</span>
            <span class="time-label">Minutes</span>
          </div>
          <div class="time-box">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">Seconds</span>
          </div>
        </div>
      </div>
      
      <a href="./message.html" class="next-btn">Read My Message ✨</a>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
